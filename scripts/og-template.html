<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image template — 1200×630</title>
    <!--
      Source for /public/og.png. Not shipped: Vite only copies public/, and this
      file is never imported. Regenerate after changing the hero positioning line:

        pnpm dev
        open http://localhost:5173/scripts/og-template.html
        screenshot the viewport at exactly 1200x630 -> public/og.png

      Tokens mirror style.css :root (--ink #000, --paper #ededee, Inter Tight / Unbounded).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Inter+Tight:wght@300;400;500&family=Unbounded:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #000;
        --paper: #ededee;
        --muted: rgba(237, 237, 238, 0.4);
        --line: rgba(255, 255, 255, 0.13);
        --sans: "Inter", system-ui, sans-serif;
        --display: "Inter Tight", var(--sans);
        --chip: "Unbounded", var(--sans);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: var(--ink);
      }

      .frame {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--sans);
      }

      /* Echo of the hero pointer glow, top-right, behind everything. */
      .glow {
        position: absolute;
        top: -220px;
        right: -160px;
        width: 760px;
        height: 760px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.24) 0%,
          rgba(255, 255, 255, 0.08) 40%,
          transparent 70%
        );
      }

      .frame > * {
        position: relative;
      }

      .top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }

      .eyebrow {
        font-family: var(--chip);
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .monogram {
        width: 72px;
        height: 72px;
        display: block;
      }

      h1 {
        font-family: var(--display);
        font-weight: 300;
        font-size: 96px;
        line-height: 1.06;
        letter-spacing: -0.032em;
        max-width: 15ch;
        /* Descenders in "doing" must clear the divider rule below. */
        padding-bottom: 20px;
      }

      h1 em {
        font-style: normal;
        color: var(--muted);
      }

      .bottom {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 48px;
        padding-top: 40px;
        border-top: 1px solid var(--line);
      }

      .name {
        font-family: var(--display);
        font-weight: 500;
        font-size: 34px;
        letter-spacing: -0.02em;
      }

      .role {
        font-size: 26px;
        letter-spacing: -0.01em;
        color: var(--muted);
        margin-top: 6px;
      }

      .url {
        font-family: var(--chip);
        font-weight: 500;
        font-size: 19px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="glow"></div>

      <div class="top">
        <p class="eyebrow">Portfolio / 2026</p>
        <svg class="monogram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
          <path fill="#ededee" d="M8 0h56v56l-8 8H0V8z" />
          <path fill="#000" d="M14 18h8l10 13 10-13h8v28h-8V30L32 42 22 30v16h-8z" />
        </svg>
      </div>

      <h1>Software for people <em>doing real work.</em></h1>

      <div class="bottom">
        <div>
          <p class="name">Manuel Mendez</p>
          <p class="role">Front-end Engineer · Calgary, AB</p>
        </div>
        <p class="url">portfoliopagemanuel.netlify.app</p>
      </div>
    </div>
  </body>
</html>
